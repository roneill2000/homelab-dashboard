<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#060913" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <title>Homelab Command Center · 192.168.0.2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="/static/react.js"></script>
  <script src="/static/react-dom.js"></script>
  <script>window.__INITIAL_TELEMETRY__ = {};</script>
  <style>
    :root {
      --bg-deep: #060913;
      --bg-card: rgba(15, 23, 42, 0.68);
      --bg-card-hover: rgba(22, 33, 58, 0.84);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-bright: rgba(56, 189, 248, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent-cyan: #38bdf8;
      --accent-indigo: #818cf8;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --accent-violet: #a855f7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-deep);
      background-image:
        radial-gradient(circle at 12% 10%, rgba(56, 189, 248, 0.12), transparent 36%),
        radial-gradient(circle at 88% 14%, rgba(129, 140, 248, 0.12), transparent 38%),
        radial-gradient(circle at 50% 85%, rgba(16, 185, 129, 0.07), transparent 45%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 100px;
    }

    .app-shell {
      max-width: 1580px;
      margin: 0 auto;
      padding: 20px 24px;
    }

    /* Top Status Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      padding: 14px 20px;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      margin-bottom: 16px;
      box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.5);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.22), rgba(129, 140, 248, 0.22));
      border: 1px solid rgba(56, 189, 248, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
      flex-shrink: 0;
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #ffffff, #bae6fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-sub {
      font-size: 0.76rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-emerald);
      box-shadow: 0 0 10px var(--accent-emerald);
      animation: pulse 2s infinite;
      flex-shrink: 0;
    }

    .pulse-dot.warn {
      background: var(--accent-amber);
      box-shadow: 0 0 10px var(--accent-amber);
    }

    .pulse-dot.offline {
      background: var(--accent-rose);
      box-shadow: 0 0 10px var(--accent-rose);
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.25); opacity: 0.65; }
    }

    /* Alert Strip */
    .syslog-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 18px;
      margin-bottom: 18px;
      border-radius: 14px;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #fde68a;
      text-decoration: none;
      font-size: 0.82rem;
      transition: all 0.2s ease;
    }

    .syslog-banner:hover {
      background: rgba(245, 158, 11, 0.18);
      border-color: rgba(245, 158, 11, 0.55);
    }

    .syslog-banner-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .syslog-banner-title {
      white-space: nowrap;
      flex-shrink: 0;
    }

    .syslog-banner-msg {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.76rem;
      color: #fef3c7;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    /* Search & Header Pills */
    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      background: rgba(6, 9, 19, 0.75);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 9px 36px 9px 36px;
      border-radius: 12px;
      font-size: 0.84rem;
      width: 268px;
      transition: all 0.2s ease;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent-cyan);
      width: 310px;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .search-icon {
      position: absolute;
      left: 11px;
      color: var(--text-dim);
      pointer-events: none;
    }

    .search-kbd {
      position: absolute;
      right: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      color: var(--text-dim);
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 6px;
      border-radius: 5px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .search-clear {
      position: absolute;
      right: 8px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: var(--text-main);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      line-height: 1;
    }

    .stat-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 13px;
      background: rgba(6, 9, 19, 0.65);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .stat-pill strong {
      color: var(--text-main);
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
    }

    /* Hero Telemetry Bento Grid */
    .bento-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .bento-card {
      background: var(--bg-card);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    }

    .bento-card:hover {
      transform: translateY(-2px);
      border-color: rgba(56, 189, 248, 0.28);
      box-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.6);
    }

    .bento-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 14px;
    }

    .bento-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .bento-title-wrap > div {
      min-width: 0;
      overflow: hidden;
    }

    .bento-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
    }

    .bento-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bento-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(16, 185, 129, 0.14);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .action-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.69rem;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 7px;
      border: 1px solid rgba(56, 189, 248, 0.35);
      background: rgba(56, 189, 248, 0.12);
      color: #7dd3fc;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .action-btn:hover {
      background: rgba(56, 189, 248, 0.26);
      color: #ffffff;
    }

    .action-btn.amber {
      border-color: rgba(245, 158, 11, 0.4);
      background: rgba(245, 158, 11, 0.14);
      color: #fcd34d;
    }

    /* Radial Gauges Row */
    .gauges-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 6px 0 12px;
    }

    .gauge-item {
      background: rgba(6, 9, 19, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .gauge-svg {
      width: 64px;
      height: 64px;
      transform: rotate(-90deg);
    }

    .gauge-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 5.5;
    }

    .gauge-fg {
      fill: none;
      stroke-width: 5.5;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.6s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.3s ease;
    }

    .gauge-center {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gauge-val {
      position: absolute;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .gauge-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 5px;
      font-weight: 500;
    }

    .gauge-detail {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.64rem;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .bento-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.75rem;
      color: var(--text-muted);
      gap: 6px;
      flex-wrap: wrap;
    }

    .bento-foot strong {
      color: var(--text-main);
      font-family: 'JetBrains Mono', monospace;
    }

    /* Drive Pills inside Proxmox & Unraid cards */
    .drive-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }

    .drive-pill {
      background: rgba(6, 9, 19, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
    }

    .drive-temp {
      color: #34d399;
      font-weight: 600;
    }

    .drive-temp.warm {
      color: var(--accent-amber);
    }

    /* Category Filter Pills */
    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .tabs-scroll {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .tabs-scroll::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 9px 16px;
      border-radius: 12px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      transition: all 0.18s ease;
    }

    .tab-btn:hover {
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.22), rgba(129, 140, 248, 0.22));
      border-color: var(--accent-cyan);
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(56, 189, 248, 0.2);
    }

    /* Section Headers */
    .section-block {
      margin-bottom: 28px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .section-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.08rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #e2e8f0;
    }

    .section-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 8px;
      border-radius: 99px;
    }

    /* Service Cards Grid */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 14px;
    }

    .svc-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 16px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      overflow: hidden;
    }

    .svc-card:hover {
      transform: translateY(-3px);
      background: var(--bg-card-hover);
      border-color: var(--border-bright);
      box-shadow: 0 14px 30px -10px rgba(0, 0, 0, 0.65);
    }

    .svc-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .svc-identity {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .svc-icon-box {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(6, 9, 19, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 7px;
    }

    .svc-icon-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .svc-fallback-icon {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 0.92rem;
      color: var(--accent-cyan);
      letter-spacing: -0.03em;
    }

    .svc-name {
      font-family: 'Outfit', sans-serif;
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .svc-desc {
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-top: 2px;
      line-height: 1.35;
    }

    .ip-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.69rem;
      color: #93c5fd;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.24);
      padding: 5px 9px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .ip-badge:hover {
      background: rgba(56, 189, 248, 0.25);
      color: #ffffff;
    }

    .svc-metrics {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .metric-chip {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      padding: 4px 8px;
      border-radius: 7px;
      background: rgba(6, 9, 19, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
    }

    .metric-chip.hi {
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.25);
      background: rgba(56, 189, 248, 0.08);
    }

    .metric-chip.ok {
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.25);
      background: rgba(16, 185, 129, 0.08);
    }

    .metric-chip.warn {
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.35);
      background: rgba(245, 158, 11, 0.12);
    }

    /* Live Fleet & IP Matrix Lower Split */
    .split-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 16px;
      margin-top: 8px;
    }

    .panel-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 18px;
    }

    .ip-matrix-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .ip-cell {
      background: rgba(6, 9, 19, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      transition: all 0.16s ease;
    }

    .ip-cell:hover {
      border-color: var(--accent-cyan);
      background: rgba(15, 23, 42, 0.9);
      transform: translateY(-1px);
    }

    .ip-octet {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--accent-cyan);
      background: rgba(56, 189, 248, 0.12);
      padding: 4px 8px;
      border-radius: 7px;
      margin-right: 10px;
    }

    .docker-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .docker-item {
      background: rgba(6, 9, 19, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 11px;
      padding: 8px 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
    }

    .docker-name {
      font-weight: 600;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .docker-stat {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* Empty Filter State */
    .empty-state {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 36px 20px;
      text-align: center;
      margin-bottom: 24px;
    }

    .empty-btn {
      margin-top: 12px;
      background: rgba(56, 189, 248, 0.16);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 10px;
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      cursor: pointer;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 84px;
      right: 24px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--accent-cyan);
      color: #fff;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-family: 'JetBrains Mono', monospace;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      z-index: 200;
      animation: fadeUp 0.2s ease;
    }

        e("div", { className: "gauge-center" },

            e("circle", { className: "gauge-bg", cx: 32, cy: 32, r }),

              stroke: strokeColor,
              strokeDasharray: circ,

                )
              )
            )
          )
        ),

        /* Mobile Bottom Dock (Pixel 11 Pro XL Friendly) */
        e("nav", { className: "mobile-dock" },
          [
            { id: "all", icon: "⚡", label: "All" },
            { id: "infra", icon: "🖥️", label: "Infra" },
            { id: "network", icon: "🌐", label: "Net" },
            { id: "media", icon: "🎬", label: "Media" },
            { id: "cloud", icon: "☁️", label: "Cloud" }
          ].map(t =>
            e("button", {
              key: t.id,
              className: `dock-btn ${tab === t.id ? "active" : ""}`,
              onClick: () => {
                setTab(t.id);
                window.scrollTo({ top: 0, behavior: "smooth" });
              }
            },
              e("span", { style: { fontSize: "1.05rem" } }, t.icon),
              e("span", null, t.label)
            )
          )
        ),

        toast && e("div", { className: "toast" }, toast)
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(e(App));
  </script>
</body>
</html>
