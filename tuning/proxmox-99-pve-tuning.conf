# Proxmox VE & Hypervisor Virtual Memory Tuning
vm.swappiness = 1
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
vm.vfs_cache_pressure = 50

# Network socket backlog and fastopen
net.core.somaxconn = 4096
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_slow_start_after_idle = 0

# Disable NMI watchdog to stop 1-second CPU timer interrupts on low-power Intel cores
kernel.nmi_watchdog = 0

# Disable desktop TTY session autogrouping so cgroup v2 weights are strictly honored
kernel.sched_autogroup_enabled = 0

# 2.5G/10G High Bandwidth-Delay Product (BDP) TCP Buffer Tuning
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 131072 16777216
net.core.netdev_max_backlog = 10000


