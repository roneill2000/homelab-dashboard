.qwen-answer p{margin:0 0 10px}.qwen-answer ul,.qwen-answer ol{margin:0 0 10px;padding-left:22px}.qwen-answer li{margin:3px 0}.qwen-answer h4{font-size:16px;margin:14px 0 6px}.qwen-answer code{font-family:ui-monospace,monospace;font-size:.92em;background:var(--panel2);border:1px solid var(--border);border-radius:5px;padding:1px 5px;overflow-wrap:anywhere}.qwen-answer strong{font-weight:650}

.status-line{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}.status-line .all-clear{display:inline-flex;align-items:center;gap:8px;color:var(--accent);font-weight:600;font-size:15px;padding:8px 2px}
.issue-chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid color-mix(in srgb,#f3c87b,transparent 50%);background:color-mix(in srgb,#f3c87b,transparent 88%);color:var(--text);font-weight:550;cursor:pointer}.issue-chip.soft{border-color:var(--border);background:var(--panel)}
.quick-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 16px}.quick-actions>button{min-height:44px;gap:8px;display:inline-flex;align-items:center}
.pc-power{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:10px 12px;margin:0 0 16px}.pc-power.compact{margin:0;padding:6px 6px 6px 12px}.pc-power button{min-height:44px;gap:8px;display:inline-flex;align-items:center;margin-left:auto}
.pc-dot{width:9px;height:9px;border-radius:50%;background:var(--faint);flex-shrink:0}.pc-dot.on{background:var(--accent)}.pc-dot.off{background:#f3c87b}.pc-label{display:flex;flex-direction:column;line-height:1.25}.pc-label small{color:var(--muted);font-size:13px}
.nav-badge{background:color-mix(in srgb,#f3c87b,transparent 70%)!important;color:var(--text)!important;border-radius:999px;padding:0 7px}
.qwen-slim.qwen-collapsed .qwen-heading,.qwen-slim.qwen-collapsed .qwen-status,.qwen-slim.qwen-collapsed .qwen-gpu{display:none}.qwen-slim.qwen-collapsed{margin-bottom:16px}.qwen-slim.qwen-collapsed .qwen-panel{padding:8px}
@media(max-width:600px){.quick-actions>button{flex:1 1 calc(50% - 5px)}.quick-actions .pc-power{flex:1 1 100%}}
.speed-links{display:inline-flex;gap:14px}.text-button.inline{display:inline;padding:0;min-height:0;font:inherit;color:var(--accent);text-decoration:underline}

.host-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}@media(max-width:1300px){.host-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:760px){.host-grid{grid-template-columns:1fr}}
.pi-roles{list-style:none;padding:0;margin:12px 0 6px;display:grid;gap:6px}.pi-roles li{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted)}.pi-roles b{font-weight:600;color:var(--text);text-align:right}.pi-roles b.ok{color:var(--accent)}.pi-roles b.warn{color:#f3c87b}
.offsite-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin:-8px 0 28px}@media(max-width:760px){.offsite-row{grid-template-columns:1fr}}

.net-section{margin:0 0 28px}.net-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.net-grid.compact .net-card{padding:16px}
@media(max-width:1200px){.net-grid{grid-template-columns:1fr}.net-grid.compact{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:760px){.net-grid.compact{grid-template-columns:1fr}}
.net-now{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.net-now small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}.net-now strong{font-size:24px;font-weight:650;letter-spacing:-.01em}
.net-totals{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid var(--border);padding-top:10px;margin-top:8px}.net-totals small{display:block;color:var(--muted);font-size:12px}.net-totals span{font-size:14px;font-variant-numeric:tabular-nums}.net-totals em{display:block;font-style:normal;font-size:11px;color:var(--faint)}

.offsite-sources{list-style:none;margin:.4rem 0;padding:0;display:grid;gap:.25rem}
.offsite-sources li{display:flex;justify-content:space-between;gap:1rem;font-size:.9rem}
.offsite-sources li span:first-child{color:var(--muted)}
.offsite-sources li span.error{color:#ed9e98}
.drive-smart{font-size:13px;color:var(--faint);margin-top:2px}.drive-smart .error{color:#ed9e98}
.readiness-table{display:grid;border:1px solid var(--border);border-radius:9px;overflow:hidden;margin-bottom:12px}
.readiness-row{display:grid;grid-template-columns:1.1fr 1.2fr 1fr 1.4fr;gap:14px;padding:11px 14px;border-bottom:1px solid var(--border);font-size:14px;color:var(--muted);align-items:start}
.readiness-row:last-child{border:0}.readiness-row strong{color:var(--text);font-weight:500}.readiness-head{background:var(--panel2);letter-spacing:1px;font-size:13px}
.readiness-row small{display:block;font-size:12px;color:var(--faint);margin-top:2px}.readiness-row .error{color:#ed9e98}
.timeline-panel{padding-top:8px}.timeline-day h3{font-size:13px;color:var(--faint);letter-spacing:1px;margin:14px 0 6px}
.timeline-day ul{list-style:none;margin:0;padding:0}.timeline-day li{display:grid;grid-template-columns:72px 24px 1fr auto;gap:10px;align-items:start;padding:7px 0;border-bottom:1px solid var(--border)}
.timeline-day li:last-child{border:0}.timeline-time{font-size:13px;color:var(--faint);padding-top:1px}.timeline-icon{color:var(--muted);padding-top:1px}
.timeline-day li strong{font-size:14px;font-weight:500}.timeline-day li small{display:block;font-size:12px;color:var(--faint)}.timeline-day li p{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.timeline-day li.bad strong,.timeline-day li.bad .timeline-icon{color:#ed9e98}.timeline-source{font-size:12px;color:var(--faint);white-space:nowrap}
@media (max-width:760px){.readiness-row{grid-template-columns:1fr 1fr}.readiness-head{display:none}.timeline-day li{grid-template-columns:60px 20px 1fr}.timeline-source{display:none}}
.qwen-target{flex-shrink:0;max-width:190px;min-height:44px;font-size:14px}@media (max-width:760px){.qwen-input-row{flex-wrap:wrap}.qwen-target{flex:1 1 100%;max-width:none}}
@media (max-width:760px){.section-heading{flex-wrap:wrap}.section-heading .segments{flex-wrap:wrap}}
