/* Large font scale (user/browser text zoom): keep summary values on one line and nav labels fully visible.
   rem-based clamps scale with the root font up to the cap, so words never exceed the tile width;
   specificity (body + :is) beats the later-loaded .ov-hero rules in m3-expressive-components.css. */
body :is(.ov-hero .summary-grid,.summary-grid)>.summary-stat strong.text-value{overflow-wrap:normal;word-break:normal;hyphens:manual;
  font-size:clamp(16px,1.375rem,22px);line-height:1.35}
.m3-nav-bar .m3-nav-label{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.15;font-size:clamp(10px,0.75rem,12px)}

/* Brand status may need two lines ("Backup status unknown") rather than an ellipsis. */
.m3-brand__text strong{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
/* Compact nav labels: 12px minimum (M3 label-medium). */
.m3-nav-bar .m3-nav-label{font-size:12px}
/* Alert snooze active: the quick action carries the state (tertiary = needs remembering, not an error). */
.quick-actions .is-snoozed{background:var(--md-sys-color-tertiary-container);color:var(--md-sys-color-on-tertiary-container)}
/* Local AI request history tables (30 Oct 2026). */

/* Material 3 look for the pre-M3 classes still used by the views (styles.css). Loaded after styles.css.
   Each rule maps one legacy class to its M3 component (component-tokens.md has the source values).
   As each view moves to the React components in src/m3.jsx, its legacy classes stop being used; delete a rule
   here only when `grep -c 'className="<class>' src/app.jsx` is 0. */
/* .panel -> outlined card (container surface, 1px outline-variant, medium shape) */
.panel{background:var(--md-sys-color-surface);border:1px solid var(--md-sys-color-outline-variant);border-radius:var(--md-sys-shape-corner-medium);box-shadow:none;padding:16px}@media (hover: hover) { 
.panel:hover { border-color:var(--md-sys-color-outline-variant) } }@media (min-width:600px){
  .panel{padding:20px}
}
.panel-title h3{font:var(--md-sys-typescale-title-medium-weight) var(--md-sys-typescale-title-medium-size)/var(--md-sys-typescale-title-medium-line-height) var(--md-sys-typescale-title-medium-font);letter-spacing:var(--md-sys-typescale-title-medium-tracking)}
.panel-title p{color:var(--md-sys-color-on-surface-variant);font:var(--md-sys-typescale-body-medium-weight) var(--md-sys-typescale-body-medium-size)/var(--md-sys-typescale-body-medium-line-height) var(--md-sys-typescale-body-medium-font)}
/* .icon-tile -> 40px tonal icon container (secondary-container, medium shape) */
.icon-tile{width:40px;height:40px;border:0;border-radius:var(--md-sys-shape-corner-medium);background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container)}
/* Section headings -> title-large */
.section-heading h2,main h2{font:var(--md-sys-typescale-title-large-weight) var(--md-sys-typescale-title-large-size)/var(--md-sys-typescale-title-large-line-height) var(--md-sys-typescale-title-large-font);letter-spacing:var(--md-sys-typescale-title-large-tracking);color:var(--md-sys-color-on-surface)}
.section-heading p{color:var(--md-sys-color-on-surface-variant)}
.section-heading{margin:32px 0 16px}
/* .segments -> segmented buttons (40px, 1px outline, full shape, selected = secondary-container) */
/* Buttons: .primary-button -> filled, .secondary-button -> tonal, .text-button -> text */
/* .notice -> warning banner (amber custom colour container, medium shape) */
.notice{border:0;border-radius:var(--md-sys-shape-corner-medium);background:var(--md-custom-amber-container);color:var(--md-custom-on-amber-container);padding:12px 16px}
/* .track -> linear progress (4px, surface-container-highest track, primary or accent indicator) */
.track{height:4px;border-radius:var(--md-sys-shape-corner-full);background:var(--md-sys-color-surface-container-highest)}
.track i{border-radius:inherit;transition:width var(--md-sys-motion-duration-medium2) var(--md-sys-motion-easing-standard)}
/* .service-card -> outlined card with a state layer instead of the lift-on-hover */
.service-card{background:var(--md-sys-color-surface);border:1px solid var(--md-sys-color-outline-variant);border-radius:var(--md-sys-shape-corner-medium)}@media (hover: hover) { 
.service-card:hover { transform:none;border-color:var(--md-sys-color-outline-variant);box-shadow:var(--md-sys-elevation-level1) } }
/* Overview issue chips -> assist chips (32px, small shape) */
/* Big metric numbers -> display-small (headline-medium on phones) */
.summary-stat strong,.storage-values strong,.storage-grid .storage-values strong{font-family:var(--md-sys-typescale-display-small-font);font-size:var(--md-sys-typescale-display-small-size);
  font-weight:var(--md-sys-typescale-display-small-weight);line-height:var(--md-sys-typescale-display-small-line-height);
  letter-spacing:var(--md-sys-typescale-display-small-tracking);font-variant-numeric:tabular-nums}@media (max-width:599px){
  .summary-stat strong,.storage-values strong,.storage-grid .storage-values strong{font-family:var(--md-sys-typescale-headline-medium-font);font-size:var(--md-sys-typescale-headline-medium-size);
  line-height:var(--md-sys-typescale-headline-medium-line-height)}
}
/* ---------- Android feel (26 Oct 2026): filled cards, Roboto Flex numbers ---------- */
/* Numbers and addresses in Roboto Flex with tabular figures; log lines and evidence stay monospace. */
.mono,.device-label,.chart-label,.service-address,.update-detail small,.ip-square{font-family:var(--md-ref-typeface-plain);font-variant-numeric:tabular-nums}
/* Phones: segmented buttons stay one row and share the width (they scroll sideways if they cannot fit). */
/* Code and log text: Google Sans Code */
.log-message,.log-entry-details .log-message,.evidence-source pre,code,pre{font-family:var(--md-ref-typeface-code)}

/* Material 3 components for the Homepage dashboard.
   Sizes, colours, shapes and type come from the M3 component tokens in component-tokens.md
   (material-web tokens v0_192). Requires m3-sys.css and the generated colour tokens (m3-tokens.mjs).
   Copy this file to src/m3-components.css unchanged. Class names are the contract used in markup.md. */
/* ---------- Base ---------- */
body{margin:0;background:var(--md-sys-color-surface);color:var(--md-sys-color-on-surface);
  font-family:var(--md-sys-typescale-body-medium-font);font-size:var(--md-sys-typescale-body-medium-size);
  line-height:var(--md-sys-typescale-body-medium-line-height);letter-spacing:var(--md-sys-typescale-body-medium-tracking);
  -webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:border-box}
:focus-visible{outline:3px solid var(--md-sys-color-secondary);outline-offset:2px}@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
}
/* Material Symbols Rounded (loaded by build.mjs from Google Fonts) */
/* width/height/overflow keep the box icon-sized before the font loads (otherwise the ligature name shows as wide text) */
.material-symbols-rounded{width:1em;height:1em;overflow:hidden;font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;
  letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;
  -webkit-font-feature-settings:'liga';font-feature-settings:'liga';-webkit-font-smoothing:antialiased;
  font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;user-select:none;flex-shrink:0}
.material-symbols-rounded.is-filled{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}

.m3-body-medium{font:var(--md-sys-typescale-body-medium-weight) var(--md-sys-typescale-body-medium-size)/var(--md-sys-typescale-body-medium-line-height) var(--md-sys-typescale-body-medium-font);letter-spacing:var(--md-sys-typescale-body-medium-tracking)}
.m3-body-small{font:var(--md-sys-typescale-body-small-weight) var(--md-sys-typescale-body-small-size)/var(--md-sys-typescale-body-small-line-height) var(--md-sys-typescale-body-small-font);letter-spacing:var(--md-sys-typescale-body-small-tracking)}
.m3-label-large{font:var(--md-sys-typescale-label-large-weight) var(--md-sys-typescale-label-large-size)/var(--md-sys-typescale-label-large-line-height) var(--md-sys-typescale-label-large-font);letter-spacing:var(--md-sys-typescale-label-large-tracking)}

/* ---------- State layer (hover 8%, focus 12%, pressed 12%) ----------
   Add .m3-state to any interactive element. The overlay uses the element's text colour. */
.m3-state{position:relative;isolation:isolate;cursor:pointer;-webkit-tap-highlight-color:transparent}
.m3-state::before{content:'';position:absolute;inset:0;border-radius:inherit;background:currentColor;opacity:0;pointer-events:none;z-index:-1;
  transition:opacity var(--md-sys-motion-duration-short2) var(--md-sys-motion-easing-standard)}@media (hover: hover) { 
.m3-state:hover::before { opacity:var(--md-sys-state-hover-state-layer-opacity) } }
.m3-state:focus-visible::before{opacity:var(--md-sys-state-focus-state-layer-opacity)}
.m3-state:active::before{opacity:var(--md-sys-state-pressed-state-layer-opacity)}
.m3-state:disabled,.m3-state[aria-disabled=true]{cursor:default}
.m3-state:disabled::before,.m3-state[aria-disabled=true]::before{opacity:0}
/* ---------- Buttons (filled, tonal, outlined, text): 40px tall, full shape, label-large ---------- */
/* ---------- Icon buttons: 40px state layer, 24px icon, 48px touch target ---------- */
.m3-icon-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;padding:0;border:0;
  border-radius:var(--md-sys-shape-corner-full);background:transparent;color:var(--md-sys-color-on-surface-variant);text-decoration:none}

/* ---------- Assist chips (status): 32px, small shape, outline; tone variants use custom colours ---------- */
/* ---------- Badges: small 6px dot, large 16px with label-small ---------- */
.m3-badge-host{position:relative;display:inline-flex}
