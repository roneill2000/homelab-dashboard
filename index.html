/* Large font scale (user/browser text zoom): keep summary values on one line and nav labels fully visible.
   rem-based clamps scale with the root font up to the cap, so words never exceed the tile width;
   specificity (body + :is) beats the later-loaded .ov-hero rules in m3-expressive-components.css. */
body :is(.ov-hero .summary-grid,.summary-grid)>.summary-stat strong.text-value{overflow-wrap:normal;word-break:normal;hyphens:manual;
  font-size:clamp(16px,1.375rem,22px);line-height:1.35}

   Each rule maps one legacy class to its M3 component (component-tokens.md has the source values).
   As each view moves to the React components in src/m3.jsx, its legacy classes stop being used; delete a rule
   here only when `grep -c 'className="<class>' src/app.jsx` is 0. */
/* .panel -> outlined card (container surface, 1px outline-variant, medium shape) */
.panel{background:var(--md-sys-color-surface);border:1px solid var(--md-sys-color-outline-variant);border-radius:var(--md-sys-shape-corner-medium);box-shadow:none;padding:16px}@media (hover: hover) {

.panel-title p{color:var(--md-sys-color-on-surface-variant);font:var(--md-sys-typescale-body-medium-weight) var(--md-sys-typescale-body-medium-size)/var(--md-sys-typescale-body-medium-line-height) var(--md-sys-typescale-body-medium-font)}
/* .icon-tile -> 40px tonal icon container (secondary-container, medium shape) */
.icon-tile{width:40px;height:40px;border:0;border-radius:var(--md-sys-shape-corner-medium);background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container)}
/* Section headings -> title-large */
.section-heading h2,main h2{font:var(--md-sys-typescale-title-large-weight) var(--md-sys-typescale-title-large-size)/var(--md-sys-typescale-title-large-line-height) var(--md-sys-typescale-title-large-font);letter-spacing:var(--md-sys-typescale-title-large-tracking);color:var(--md-sys-color-on-surface)}

/* .segments -> segmented buttons (40px, 1px outline, full shape, selected = secondary-container) */
/* Buttons: .primary-button -> filled, .secondary-button -> tonal, .text-button -> text */
/* .notice -> warning banner (amber custom colour container, medium shape) */
.notice{border:0;border-radius:var(--md-sys-shape-corner-medium);background:var(--md-custom-amber-container);color:var(--md-custom-on-amber-container);padding:12px 16px}

/* Overview issue chips -> assist chips (32px, small shape) */
/* Big metric numbers -> display-small (headline-medium on phones) */

/* Hero card tonal roles (A5). The pine theme is a Fidelity scheme, so primary-container is the seed pine in both themes.
