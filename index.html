.segments{display:flex;gap:2px;border:1px solid var(--md-sys-color-outline-variant);background:var(--md-sys-color-surface-container-low);padding:3px;border-radius:7px}
.segments button{background:none;border:0;color:var(--md-sys-color-on-surface-variant);font-size:14px;border-radius:4px;padding:4px 9px}
.segments button.selected{background:var(--md-sys-color-surface-container-high);color:var(--md-sys-color-on-surface);box-shadow:0 1px 3px color-mix(in srgb,var(--md-sys-color-scrim) 13%,transparent)}
.segments button:hover{color:var(--md-sys-color-on-surface)}
.text-button{display:inline-flex;align-items:center;gap:7px;color:var(--md-sys-color-on-surface-variant);background:none;border:0;padding:0;font-size:14px;white-space:nowrap}
.text-button:hover{color:var(--md-sys-color-primary)}
.two-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}
.panel{padding:22px;background:var(--md-sys-color-surface-container-low);border:1px solid var(--md-sys-color-outline-variant);border-radius:13px;box-shadow:var(--md-sys-elevation-level1);min-width:0;transition:border-color .2s}
.panel:hover{border-color:color-mix(in srgb,var(--md-sys-color-outline-variant),var(--md-sys-color-on-surface-variant) 18%)}
.panel-header{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:20px}
.panel-title{display:flex;align-items:center;gap:11px;min-width:0}
.panel-title h3{font-size:14px}
.panel-title p{font-size:14px;color:var(--md-sys-color-on-surface-variant);margin-top:3px}
.icon-tile{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--md-sys-color-outline-variant);background:var(--md-sys-color-surface-container);border-radius:9px;color:var(--md-custom-blue);flex-shrink:0}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:14px;padding:3px 6px;border:1px solid var(--md-sys-color-outline-variant);border-radius:5px;white-space:nowrap;color:var(--md-sys-color-on-surface-variant)}
.badge i{height:4px;width:4px;border-radius:50%;background:currentColor}
.badge.good{color:var(--md-sys-color-primary);background:color-mix(in srgb,var(--md-custom-teal) 3%,transparent);border-color:color-mix(in srgb,var(--md-custom-teal) 11%,transparent)}
.badge.bad{color:var(--md-custom-pink);background:color-mix(in srgb,var(--md-custom-pink) 3%,transparent);border-color:color-mix(in srgb,var(--md-custom-pink) 13%,transparent)}
.storage-values{display:flex;gap:38px;align-items:center;margin-bottom:12px}
.storage-values small{display:flex;align-items:center;gap:5px;font-size:14px;color:var(--md-sys-color-on-surface-variant)}
.legend{width:5px;height:5px;border-radius:50%;display:inline-block}
.legend.read{background:var(--md-custom-blue)}
.legend.write{background:var(--md-custom-teal)}
.storage-values strong{font-family:var(--md-ref-typeface-brand);font-size:26px;font-weight:600;letter-spacing:-.8px;font-variant-numeric:tabular-nums}
.storage-values em,.host-stats em,.wan-speeds em{font-size:14px;font-style:normal;color:var(--md-sys-color-on-surface-variant);font-weight:500;letter-spacing:0;margin-left:5px}
.device-label{margin-left:auto;color:var(--md-sys-color-on-surface-variant);text-align:right;font-family:ui-monospace,monospace;font-size:14px;line-height:1.9}
.chart{position:relative;min-height:75px;margin:0 -2px 16px}
.chart svg{display:block;width:100%;overflow:visible}
.chart-grid{stroke:var(--md-sys-color-outline-variant);stroke-dasharray:3 5;stroke-width:1}
.chart-label{fill:var(--md-sys-color-on-surface-variant);font-size:14px;font-family:ui-monospace,monospace}
.chart-cursor{stroke:var(--md-sys-color-on-surface-variant);stroke-dasharray:3 3}
.chart-empty{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;gap:10px;font-size:14px;color:var(--md-sys-color-on-surface-variant);pointer-events:none}
.chart-tooltip{position:absolute;bottom:28px;right:0;background:var(--md-sys-color-surface);border:1px solid var(--md-sys-color-outline-variant);border-radius:6px;box-shadow:var(--md-sys-elevation-level1);padding:7px 9px;font-size:14px;display:flex;gap:8px;pointer-events:none;z-index:2;white-space:nowrap}
.meter>div:first-child{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--md-sys-color-on-surface-variant);margin-bottom:8px}
.track{height:4px;width:100%;background:var(--md-sys-color-surface-container-high);border-radius:10px;overflow:hidden}
.track i{display:block;height:100%;border-radius:10px;background:var(--md-sys-color-primary);transition:width .8s cubic-bezier(.22,1,.36,1)}
.storage-footer{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--md-sys-color-on-surface-variant);margin-top:9px}
.host-stats{display:flex;justify-content:space-between;margin-bottom:20px;padding-right:15px}
.host-stats small{display:block;font-size:14px;color:var(--md-sys-color-on-surface-variant);margin-bottom:5px}
.host-stats strong{font-family:var(--md-ref-typeface-brand);font-size:23px;font-weight:600;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.host-footer{border-top:1px solid var(--md-sys-color-outline-variant);padding-top:13px;margin-top:16px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px;color:var(--md-sys-color-on-surface-variant)}
.host-footer span,.host-footer a{display:flex;align-items:center;gap:6px}
.host-footer a:hover{color:var(--md-sys-color-primary)}
.count{font-family:var(--md-ref-typeface-plain);font-size:14px;color:var(--md-sys-color-on-surface-variant);background:var(--md-sys-color-surface-container);border:1px solid var(--md-sys-color-outline-variant);padding:1px 5px;border-radius:5px;margin-left:6px;vertical-align:middle}
.service-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.service-card{background:var(--md-sys-color-surface-container-low);border:1px solid var(--md-sys-color-outline-variant);border-radius:11px;position:relative;transition:transform .2s,border-color .2s,box-shadow .2s;min-width:0;overflow:hidden}
.service-card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--service-color),transparent 55%);box-shadow:0 8px 20px color-mix(in srgb,var(--md-sys-color-scrim) 13%,transparent)}
.service-link{padding:19px 17px 28px;display:flex;align-items:flex-start;gap:12px;min-height:118px}
.service-link>div{min-width:0}
.service-icon{display:grid;place-items:center;background:color-mix(in srgb,var(--service-color),transparent 92%);color:var(--service-color);width:38px;height:38px;flex-shrink:0;border:1px solid color-mix(in srgb,var(--service-color),transparent 85%);border-radius:10px}
.service-link h3{font-size:14px;display:flex;align-items:center;gap:7px;line-height:1.6}
.service-link p{font-size:14px;color:var(--md-sys-color-on-surface-variant);margin-top:3px}
.service-address{font-family:ui-monospace,monospace;font-size:14px;color:var(--md-sys-color-on-surface-variant);display:block;margin-top:11px}
.service-dot{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--md-sys-color-on-surface-variant);flex-shrink:0}
.service-dot.online{background:var(--md-sys-color-primary)}
.service-dot.offline{background:var(--md-custom-pink)}
.launch-arrow{margin-left:auto;color:var(--md-sys-color-on-surface-variant);opacity:0;transition:opacity .2s;position:absolute;right:13px;top:14px}
.service-card:hover .launch-arrow{opacity:1}
.pin-button{position:absolute;right:10px;bottom:8px;background:none;border:0;color:var(--md-sys-color-on-surface-variant);padding:4px;display:flex;opacity:.35}
.pin-button:hover,.pin-button:focus,.pin-button.pinned{opacity:1}
.pin-button.pinned{color:var(--md-custom-amber)}
.pin-button.pinned svg{fill:color-mix(in srgb,var(--md-custom-amber) 7%,transparent)}
.storage-toolbar{display:flex;justify-content:space-between;margin-bottom:18px}
.storage-explainer{display:flex;gap:12px;padding:18px 0;color:var(--md-sys-color-on-surface-variant);font-size:14px;margin-top:12px}
.storage-explainer strong{font-size:14px;color:var(--md-sys-color-on-surface);font-weight:500}
.storage-explainer p{font-size:14px;line-height:1.9;margin-top:3px;max-width:900px}
.drive-list{border:1px solid var(--md-sys-color-outline-variant);background:var(--md-sys-color-surface-container-low);border-radius:12px;overflow:hidden}
.drive-row{display:flex;align-items:center;gap:16px;padding:15px 20px;border-bottom:1px solid var(--md-sys-color-outline-variant)}
.drive-row:last-child{border:0}
.drive-row>svg{color:var(--md-sys-color-on-surface-variant)}
.drive-row strong{font-size:14px;font-weight:500}
.drive-row p{font-size:14px;color:var(--md-sys-color-on-surface-variant);margin-top:2px}
.drive-row .mono{margin-left:auto;font-size:14px}
.wan-speeds{display:flex;gap:45px;margin:30px 0 24px}
.wan-speeds small{display:flex;gap:5px;align-items:center;color:var(--md-sys-color-on-surface-variant);font-size:14px;margin-bottom:5px}
.wan-speeds strong{font-size:35px;font-family:var(--md-ref-typeface-brand);font-weight:600;letter-spacing:-1px}
.wan-speeds>div:first-child strong{color:var(--md-sys-color-primary)}
.copy-ip{margin-top:16px;border:1px solid var(--md-sys-color-outline-variant);background:var(--md-sys-color-surface-container);padding:9px 11px;font-size:14px;display:flex;justify-content:space-between;width:100%;border-radius:7px;color:var(--md-sys-color-on-surface-variant)}
.copy-ip .mono{margin-left:9px;color:var(--md-sys-color-on-surface)}
.dns-stat{margin-top:27px}
.dns-stat strong{font-size:35px;font-family:var(--md-ref-typeface-brand);letter-spacing:-1px}
.dns-stat em{font-family:var(--md-ref-typeface-plain);font-size:14px;color:var(--md-sys-color-on-surface-variant);font-style:normal;margin-left:8px;letter-spacing:0}
.dns-stat p{font-size:14px;color:var(--md-sys-color-on-surface-variant);margin-top:5px}
.dns-nodes{display:flex;gap:25px;font-size:14px;margin:20px 0;color:var(--md-sys-color-on-surface-variant)}
.dns-nodes span{display:flex;align-items:center;gap:6px}
.secondary-button,.primary-button{border:1px solid var(--md-sys-color-outline-variant);border-radius:7px;padding:8px 12px;background:var(--md-sys-color-surface-container);font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.secondary-button:hover{background:var(--md-sys-color-surface-container-high)}
.primary-button{background:var(--md-sys-color-primary);color:var(--md-custom-teal);border-color:var(--md-sys-color-primary);font-weight:600}
.directory-controls{display:flex;align-items:center;gap:10px}
.inline-search{background:var(--md-sys-color-surface-container-low);border:1px solid var(--md-sys-color-outline-variant);padding:7px 9px;border-radius:7px;display:flex;align-items:center;gap:7px;color:var(--md-sys-color-on-surface-variant)}
.inline-search input{border:0;background:none;outline:none;color:var(--md-sys-color-on-surface);font-size:14px;width:165px;min-width:0}
.inline-search:focus-within{border-color:var(--md-sys-color-primary)}
select{background:var(--md-sys-color-surface-container-low);border:1px solid var(--md-sys-color-outline-variant);color:var(--md-sys-color-on-surface-variant);padding:8px;border-radius:7px;font-size:14px}
.empty{text-align:center;padding:45px;background:var(--md-sys-color-surface-container-low);border:1px dashed var(--md-sys-color-outline-variant);border-radius:12px;font-size:14px;color:var(--md-sys-color-on-surface-variant)}
.empty h3{margin-top:10px;color:var(--md-sys-color-on-surface)}
.empty p{margin:8px}
.empty button{margin-top:12px}
.log-summary{display:flex;gap:15px;align-items:center}
.log-summary>svg{color:var(--md-custom-amber)}
.log-summary>div{min-width:0;flex:1}
.log-summary h3{font-size:14px}
.log-summary p{font-size:14px;color:var(--md-sys-color-on-surface-variant);overflow-wrap:anywhere;margin-top:5px}
.log-summary small{font-size:14px;color:var(--md-sys-color-on-surface-variant);display:block;margin-top:8px}
.log-summary button{flex-shrink:0}
.fleet-table{border:1px solid var(--md-sys-color-outline-variant);border-radius:12px;background:var(--md-sys-color-surface-container-low);overflow:hidden}
.fleet-row{display:grid;grid-template-columns:minmax(160px,2fr) .7fr .6fr .8fr .65fr;align-items:center;gap:20px;padding:13px 20px;border-bottom:1px solid var(--md-sys-color-outline-variant);font-size:14px;color:var(--md-sys-color-on-surface-variant)}
.fleet-row:last-child{border:0}
.fleet-row.table-head{font-size:14px;letter-spacing:1px;background:var(--md-sys-color-surface-container);padding-top:12px;padding-bottom:12px}
.fleet-row .badge{justify-self:start}
.fleet-name{display:flex;align-items:center;gap:12px;min-width:0}
.fleet-name strong{font-weight:500;font-size:14px;color:var(--md-sys-color-on-surface);overflow-wrap:anywhere}
.fleet-name small{display:block;font-weight:400;font-size:14px;color:var(--md-sys-color-on-surface-variant);margin-top:3px}
.network-map{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.network-map>a{display:flex;align-items:center;gap:11px;padding:13px;background:var(--md-sys-color-surface-container-low);border:1px solid var(--md-sys-color-outline-variant);border-radius:9px;transition:border-color .2s}
.network-map>a:hover{border-color:var(--md-sys-color-primary)}
.ip-square{width:35px;height:32px;border-radius:7px;display:grid;place-items:center;background:var(--md-sys-color-surface-container);border:1px solid var(--md-sys-color-outline-variant);color:var(--md-custom-blue);font-size:14px;font-family:ui-monospace,monospace}
.network-map strong{font-size:14px;font-weight:500}
.network-map small{display:block;font-size:14px;color:var(--md-sys-color-on-surface-variant)}
.network-map i{margin-left:auto}
.notice{padding:11px 14px;background:color-mix(in srgb,var(--md-custom-amber) 3%,transparent);border:1px solid color-mix(in srgb,var(--md-custom-amber) 15%,transparent);color:var(--md-custom-amber);font-size:14px;border-radius:8px;display:flex;align-items:center;gap:9px;margin:0 0 20px}
.page-footer{display:flex;align-items:center;justify-content:space-between;margin-top:35px;padding:22px 0;border-top:1px solid var(--md-sys-color-outline-variant);font-size:14px;color:var(--md-sys-color-on-surface-variant);gap:12px}
.page-footer>span{display:flex;align-items:center;gap:9px}
.page-footer svg{color:var(--md-sys-color-on-surface-variant)}
.fatal{margin:100px auto;max-width:600px}
.fatal p{margin:20px 0}
.spinning .material-symbols-rounded{animation:spin 1s linear infinite}
.panel,.summary-grid,.service-grid,.fleet-table{animation:enter .35s ease both}
@keyframes enter{from{opacity:0;translate:0 7px}to{opacity:1;translate:0 0}}
@keyframes breathe{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--md-custom-teal) 9%,transparent)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* .panel -> outlined card (container surface, 1px outline-variant, medium shape) */

/* .segments -> segmented buttons (40px, 1px outline, full shape, selected = secondary-container) */
