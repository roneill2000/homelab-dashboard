global_defs {
  router_id pihole-10
  script_user root
  enable_script_security
  vrrp_garp_master_refresh 60
}
vrrp_script chk_dns {
  script "/etc/keepalived/check_dns.sh"
  interval 2
  timeout 3
  fall 2
  rise 2
  weight -60
}
vrrp_instance PIHOLE_VIP {
  state BACKUP
  interface end0
  virtual_router_id 53
  priority 100
  advert_int 1
  unicast_src_ip 192.168.0.10
  unicast_peer {
    192.168.0.11
  }
  authentication {
    auth_type PASS
    auth_pass <REDACTED_VRRP_PASS>
  }
  virtual_ipaddress {
    192.168.0.8/24 dev end0 label end0:vip
  }
  track_script {
    chk_dns
  }
}
