# Remote syslog on Proxmox: one file per sender in /var/log/remote, read by syslog-monitor.py
template(name="RemoteHostFile" type="string" string="/var/log/remote/%HOSTNAME:::lowercase%.log")

# Orange Pi (.10): Pi-hole replica, Uptime Kuma, nebula-sync
if ($fromhost-ip == '192.168.0.10') then {
    action(type="omfile" file="/var/log/remote/orangepi.log")
    stop
}

# LXC 106 (.11): primary Pi-hole. Its hostname is still "pihole-secondary", so map by IP.
if ($fromhost-ip == '192.168.0.11') then {
    action(type="omfile" file="/var/log/remote/pihole-primary.log")
    stop
}

# All other remote network devices write to lowercase hostname log
if ($fromhost-ip != '127.0.0.1') then {
    action(type="omfile" dynaFile="RemoteHostFile")
    stop
}
