# Proxmox's own journal, notice and above (~100 lines/day), so syslog-monitor sees hypervisor errors too
module(load="imjournal" StateFile="imjournal.state" IgnorePreviousMessages="on")
if ($fromhost-ip == '127.0.0.1' and $syslogseverity <= 5) then {
    action(type="omfile" file="/var/log/remote/proxmox.log")
}
